name: Temporary base-boundary anchor repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/althoefer-audit-gap
          fetch-depth: 0
      - name: Apply base-boundary anchor lemma
        run: python scripts/apply_base_boundary_anchor_repair.py
      - name: Run machine-checkable audit
        run: python audit.py --limit 100000
      - name: Commit repaired proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verified-results.md certificates/global-routing.json tests/test_althoefer_repair.py
          if ! git diff --cached --quiet; then
            git commit -m "Anchor first factor exit at common finite WIN source"
            git push origin HEAD:repair/althoefer-audit-gap
          fi
