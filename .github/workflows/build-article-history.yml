name: Build article history

on:
  push:
    branches:
      - agent/article-history-simple

permissions:
  contents: write

jobs:
  build-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct LaTeX sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/manuscript-history-v1-v7:refs/remotes/origin/agent/manuscript-history-v1-v7
          mkdir -p paper/history/{v2,v3.0,v4.0,v5.0,v6.3,v7.0}

          {
            git show origin/agent/manuscript-history-v1-v7:paper/history/v2/source/part-01.tex
            git show origin/agent/manuscript-history-v1-v7:paper/history/v2/source/part-02.tex
            git show origin/agent/manuscript-history-v1-v7:paper/history/v2/source/part-03.tex
          } > paper/history/v2/3n_plus_minus_1_game_finalv2.tex

          {
            git show origin/agent/manuscript-history-v1-v7:paper/history/v3.0/source/part-01.tex
            git show origin/agent/manuscript-history-v1-v7:paper/history/v3.0/source/part-02.tex
          } > paper/history/v3.0/3n_plus_minus_1_game_v3_0.tex

          cat paper/history/.incoming/v4.0/part-*.tex > paper/history/v4.0/3n_plus_minus_1_game_v4.0.tex
          cat paper/history/.incoming/v5.0/part-*.tex > paper/history/v5.0/3n_plus_minus_1_game_v5.0.tex
          cat paper/history/.incoming/v6.3/part-*.tex > paper/history/v6.3/3n_plus_minus_1_game_v6.3.tex
          cat paper/history/.incoming/v7.0/part-*.tex > paper/history/v7.0/3n_plus_minus_1_game_v7.0.tex

          # The original v1 PDF is already present in the repository history.
          git show bb6807550f6afe10e9c35b56fb2196d01486764a:paper/main.pdf > paper/history/v1/termination-optimal-3n-plus-minus-1.v1.pdf

      - name: Verify preserved sources
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | sha256sum -c -
          e162f81c8f01edb9783cd105298e5de8e10ee62900632745a2fd340dd99ae84d  paper/history/v1/main.v1.tex
          e882484e390b63fa82dcd6c6db10fb602dbf2e04090176d36f0f6efb468b40c6  paper/history/v2/3n_plus_minus_1_game_finalv2.tex
          8aaa4349d83297d8b45fcfae0c1280b61fb8635f3a61dc1c115d9c224d9290f4  paper/history/v3.0/3n_plus_minus_1_game_v3_0.tex
          02f0a4958f3615572b4bcdbe730f6f136a856d0b275e36e368e5894335ab0d3f  paper/history/v5.0/3n_plus_minus_1_game_v5.0.tex
          d922f565f46d8c6a17daaebbba694ecf4e307273392873bf5d3b6e447f14d802  paper/history/v6.3/3n_plus_minus_1_game_v6.3.tex
          a0f83c40ff1f28ef4d4797a79ff5fc1463eba4b448e98deadabeefa0f508593e  paper/history/v7.0/3n_plus_minus_1_game_v7.0.tex
          855b1486e35370b7129f2378a4261f84595f4e3c55e107765fe473b78b0f386f  paper/history/v1/termination-optimal-3n-plus-minus-1.v1.pdf
          EOF
          sha256sum paper/history/v4.0/3n_plus_minus_1_game_v4.0.tex

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Build remaining PDFs
        shell: bash
        run: |
          set -euo pipefail
          (cd paper/history/v2 && latexmk -pdf -interaction=nonstopmode -halt-on-error 3n_plus_minus_1_game_finalv2.tex)
          (cd paper/history/v3.0 && latexmk -pdf -interaction=nonstopmode -halt-on-error 3n_plus_minus_1_game_v3_0.tex)
          (cd paper/history/v4.0 && latexmk -pdf -interaction=nonstopmode -halt-on-error 3n_plus_minus_1_game_v4.0.tex)
          (cd paper/history/v5.0 && latexmk -pdf -interaction=nonstopmode -halt-on-error 3n_plus_minus_1_game_v5.0.tex)
          (cd paper/history/v6.3 && latexmk -pdf -interaction=nonstopmode -halt-on-error 3n_plus_minus_1_game_v6.3.tex)
          (cd paper/history/v7.0 && latexmk -pdf -interaction=nonstopmode -halt-on-error 3n_plus_minus_1_game_v7.0.tex)

          mv paper/history/v2/3n_plus_minus_1_game_finalv2.pdf paper/history/v2/3n_plus_minus_1_game_final.v2.pdf

          for d in v1 v2 v3.0 v4.0 v5.0 v6.3 v7.0; do
            find "paper/history/$d" -maxdepth 1 -type f \( -name '*.aux' -o -name '*.bbl' -o -name '*.blg' -o -name '*.fdb_latexmk' -o -name '*.fls' -o -name '*.log' -o -name '*.out' -o -name '*.toc' \) -delete
          done

      - name: Commit clean history tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf paper/history/.incoming
          rm -f .github/workflows/build-article-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A paper/history .github/workflows
          git commit -m "Add article history v1 through v7"
          git push origin HEAD:agent/article-history-simple
