name: Temporary Althoefer repair audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-repair-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/althoefer-audit-gap
          fetch-depth: 0

      - name: Insert stronger exponent-one predecessor reduction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          proof = Path('docs/verified-results.md')
          text = proof.read_text(encoding='utf-8')
          marker = '### The remaining attachment obligation\n'
          if marker not in text:
              raise SystemExit('Section 137 attachment marker not found')
          if '### The predecessor reduction removes every unbounded factor level' not in text:
              lemma = r'''### The predecessor reduction removes every unbounded factor level

The universal two-level scan can be sharpened before the returned source is
used.  Retain

\[
a=J(s),\qquad
R_k=Q_1^\epsilon(3^ka)\text{ DRAW},\qquad k\ge1,
\]

and put

\[
P_k=Q_2^\epsilon(3^ka),\qquad
C_k=B(P_k)=B(R_k),\qquad
T_k=A(R_k).
\]

Section 87 applied to the frame \(\{P_k,R_k\}\) gives either a
factor-free DRAW state \(Q_r^\epsilon(a)\) with \(r\ge2\), or the sole
gate orientation

\[
P_k\text{ LOSS},\qquad R_k\text{ DRAW}.
\]

Only the gate needs further work.  Consider its exact predecessor one factor
level lower,

\[
q:=P_{k-1}=Q_2^\epsilon(3^{k-1}a).
\]

The long-tail boundary identities give

\[
\boxed{A(q)=R_k,\qquad B(q)=C_{k-1}.}
\]

Since \(q\) has the DRAW child \(R_k\), it cannot be LOSS.

If \(q\) is DRAW, then for \(k=1\) it is already factor-free.  For
\(k>1\), repeated application of Section 16 is legitimate because the tail
exponent is two at every reverse step; it removes every factor of three and
produces a factor-free DRAW state over the original source \(s\).

Suppose instead that \(q\) is WIN.  Its DRAW child \(R_k\) cannot witness
WIN, hence its other child

\[
\ell:=C_{k-1}=B(q)
\]

is the unique LOSS child and

\[
\boxed{h(\ell)=h(q)-1.}
\]

There are now two exact side-return cases.

If \(q\) is nonexceptional, the ordinary side relation makes

\[
C_k=B(A(q))
\]

a child of both \(A(q)=R_k\) and \(B(q)=\ell\).  Since \(\ell\) is LOSS,

\[
\boxed{C_k\text{ WIN},\qquad h(C_k)\le h(q)-2.}
\]

The DRAW state \(R_k\) therefore forces its other child \(T_k\) to be DRAW.
The odd coefficient of \(T_k\) is factor-free: it is obtained from

\[
3^{k+1}J(s)+1-2\epsilon,
\]

which is nonzero modulo three, by removing only powers of two.  Hence this
branch reaches a factor-free DRAW while simultaneously replacing the finite
WIN token \(q\) by the certified lower WIN token \(C_k\).

If \(q\) is exceptional, Section 68 applies with exactly the outcomes now
proved:

\[
q\text{ WIN},\qquad A(q)=R_k\text{ DRAW},\qquad
B(q)=\ell\text{ LOSS}.
\]

It gives an exact adjacent factor-free pair over \(\ell\),

\[
\boxed{
\{C_k,T_k\}
=
\{Q_m^\delta(J(\ell)),Q_{m+1}^\delta(J(\ell))\}
\quad(m\ge1),
}
\]

and at least one member is DRAW.  The retained finite token has again
strictly fallen, now from \(q\) to the actual LOSS child \(\ell\).

Consequently the arbitrary exponent-one family has the stronger normal form

\[
\boxed{
\begin{minipage}{0.88\linewidth}
Every DRAW \(Q_1^\epsilon(3^kJ(s))\), \(k>0\), reaches either a
factor-free DRAW over the same source \(s\), or a factor-free DRAW
lift/frame accompanied by a certified finite proof-token descent.  No
unbounded factor exponent survives this reduction.
\end{minipage}}
\]

The remaining attachment problem is therefore a **factor-free base-entry
problem**, not an uncontrolled \(k\)-level problem.  In particular the
arbitrary high factor power itself cannot be used to reset either source or
proof height.

'''
              text = text.replace(marker, lemma + marker, 1)
              proof.write_text(text, encoding='utf-8')

          # Keep the symbolic certificate tied to the corrected proof source,
          # without enlarging its already narrowed semantic scope.
          cert_path = Path('certificates/global-routing.json')
          cert = json.loads(cert_path.read_text(encoding='utf-8'))
          cert['proof_source']['sha256'] = hashlib.sha256(proof.read_bytes()).hexdigest()
          cert_path.write_text(json.dumps(cert, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          ledger = Path('docs/proof-ledger.md')
          ltext = ledger.read_text(encoding='utf-8')
          old = '| Every arbitrary factorful exponent-one DRAW Q_1^epsilon(3^k J(s)), k>0, has the exact two-level raw/signed normalization of corrected Section 137; the returned source need not be below s | **PROVED ARITHMETIC NORMALIZATION** | Corrected Section 137, using universal Sections 79--81 |'
          new = '| Every arbitrary factorful exponent-one DRAW Q_1^epsilon(3^k J(s)), k>0, has the exact two-level normalization and predecessor reduction of corrected Section 137: either it returns to a factor-free DRAW over s or reaches a factor-free DRAW lift/frame while replacing a finite WIN/LOSS token by a certified lower descendant | **PROVED FACTOR-LEVEL AND TOKEN NORMALIZATION** | Corrected Section 137; Sections 16, 68, 79--81, 87 |'
          if old not in ltext:
              raise SystemExit('proof-ledger normalization row not found')
          ledger.write_text(ltext.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run machine-checkable audit
        run: python audit.py --limit 100000

      - name: Commit repaired proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verified-results.md docs/proof-ledger.md certificates/global-routing.json
          if ! git diff --cached --quiet; then
            git commit -m "Strengthen arbitrary exponent-one predecessor reduction"
            git push origin HEAD:repair/althoefer-audit-gap
          fi
