name: Temporary Althoefer repair audit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-repair-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/althoefer-audit-gap
          fetch-depth: 0
      - name: Apply stronger exponent-one predecessor reduction
        run: python scripts/apply_exponent_predecessor_repair.py
      - name: Run machine-checkable audit
        run: python audit.py --limit 100000
      - name: Commit repaired proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verified-results.md docs/proof-ledger.md certificates/global-routing.json
          if ! git diff --cached --quiet; then
            git commit -m "Strengthen arbitrary exponent-one predecessor reduction"
            git push origin HEAD:repair/althoefer-audit-gap
          fi
