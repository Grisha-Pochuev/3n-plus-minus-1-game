name: Verify proof artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean kernel and nanoda
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          build-args: --wfail
          test: false
          nanoda: false
          use-mathlib-cache: false
      # lean-action v1 currently looks for a `package` declaration when
      # detecting the nanoda module, while Lake's TOML format keeps `name`
      # at the top level. Supply an equivalent Lean lakefile only after the
      # warning-free kernel build, then run nanoda in the same worker.
      - name: Prepare nanoda module detection
        run: cp formal/lakefile.nanoda.lean formal/lakefile.lean
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: false
          test: false
          nanoda: true
          nanoda-allow-sorry: false
          use-mathlib-cache: false

  audit:
    name: Python proof audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify arithmetic claims
        run: python scripts/verify_claims.py --limit 100000
      - name: Verify conditional routing inventory
        run: python scripts/verify_global_certificate.py certificates/global-routing.json
