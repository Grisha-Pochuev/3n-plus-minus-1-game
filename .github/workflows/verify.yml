name: Lean verification (legacy entry)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean kernel and leanchecker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: true
          build-args: --wfail
          test: false
          leanchecker: true
          nanoda: false
          use-mathlib-cache: false
