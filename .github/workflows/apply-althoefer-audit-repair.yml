name: Apply Althoefer audit repair

on:
  push:
    branches:
      - repair/althoefer-audit-gap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-proof:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/althoefer-audit-gap
          fetch-depth: 0

      - name: Replace Sections 136-138 and refresh certificate hash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          proof = Path('docs/verified-results.md')
          replacement = Path('repairs/althoefer-sections-136-138.md').read_text(encoding='utf-8').rstrip() + '\n'
          text = proof.read_text(encoding='utf-8')
          marker = '## 136.'
          if marker not in text:
              raise SystemExit('Section 136 marker not found')
          head = text.split(marker, 1)[0]
          proof.write_text(head + replacement, encoding='utf-8')

          digest = hashlib.sha256(proof.read_bytes()).hexdigest()
          cert_path = Path('certificates/global-routing.json')
          cert = json.loads(cert_path.read_text(encoding='utf-8'))
          cert['proof_source']['sha256'] = digest
          cert['global_claim'] = (
              'The declared typed marked/obligation routing assembly is well-founded after a valid provenance-preserving entry.'
          )
          cert['claim_scope'] = (
              'The checker validates the declared finite assembly and rank logic only. '
              'After the external audit, the arbitrary factorful exponent-one entry attachment in Section 137 is explicitly OPEN; '
              'therefore certificate acceptance is not evidence for the global no-DRAW theorem.'
          )
          for item in cert.get('trusted_obligations', []):
              if item.get('id') == 'declared-guards-refine-all-game-cases':
                  item['description'] = (
                      'Every legal outcome-compatible continuation must be represented by one declared semantic guard. '
                      'The arbitrary factorful exponent-one attachment required by corrected Section 137 is not yet proved, '
                      'so this human obligation is currently OPEN for the global theorem.'
                  )
              if item.get('id') == 'outcome-compatible-draw-continuation':
                  item['description'] = (
                      'Each used macro must follow an actual DRAW member while carrying finite WIN/LOSS witnesses separately. '
                      'Corrected Section 137 isolates the still-open attachment step needed before this can be asserted globally.'
                  )
          cert_path.write_text(json.dumps(cert, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit patched proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verified-results.md certificates/global-routing.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Repair audited Sections 136-138 and narrow certificate scope"
          git push origin HEAD:repair/althoefer-audit-gap
