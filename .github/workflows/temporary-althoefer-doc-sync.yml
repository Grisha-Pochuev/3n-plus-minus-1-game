name: Temporary Althoefer documentation sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-review-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/althoefer-audit-gap
          fetch-depth: 0

      - name: Apply documentation sync
        run: python scripts/apply_althoefer_doc_sync.py

      - name: Commit to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/proof-ledger.md paper/main.tex
          git commit -m "Synchronize manuscript and ledger with external audit repair"
          git push origin HEAD:repair/althoefer-audit-gap
